version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lawai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONIOENCODING=utf-8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lawai-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONIOENCODING=utf-8
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
